<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer safety tracking circle -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Primary V monogram (Swedish safety blue) -->
  <path d="M28,32 L47,72 L53,72 L72,32" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner V overlay (Indigo glow) -->
  <path d="M38,32 L50,58 L62,32" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Central alignment indicator (Perception target) -->
  <circle cx="50" cy="42" r="3" fill="#34d399"/>
</svg>
